name: API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run monitor
        run: |
          newman run monitor-collection.json \
            -e environment.json \
            --env-var "baseUrl=https://gorest.co.in" \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
