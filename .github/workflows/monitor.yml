name: API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run monitor
        run: |
          newman run monitor-collection.json \
            --env-var "baseURL=https://gorest.co.in" \
            --env-var "token=1858910ff7b0f978783fbce9216b10267335a55b33973aaa73ba3c25ba02dd27"
