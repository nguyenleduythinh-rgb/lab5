name: API Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Check configuration
        env:
          API_TOKEN: 1858910ff7b0f978783fbce9216b10267335a55b33973aaa73ba3c25ba02dd27
        run: |
          if [ -z "1858910ff7b0f978783fbce9216b10267335a55b33973aaa73ba3c25ba02dd27" ]; then
            echo "TOKEN RONG"
            exit 1
          else
            echo "TOKEN CO GIA TRI"
          fi

      - name: Run API tests
        env:
          API_TOKEN: 1858910ff7b0f978783fbce9216b10267335a55b33973aaa73ba3c25ba02dd27
        run: |
          newman run collection.json \
            -e environment.json \
            --env-var "baseUrl=https://gorest.co.in" \
            --env-var "token=1858910ff7b0f978783fbce9216b10267335a55b33973aaa73ba3c25ba02dd27" \
            -n 3
