name: API Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: |
          newman run collection.json \
            -e environment.json \
            --env-var "token=${{ secrets.GOREST_TOKEN }}" \
            -n 3
